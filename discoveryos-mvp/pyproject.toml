[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discoveryos-mvp"
version = "0.1.0"
description = "Evidence-first research and contradiction triage prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
discoveryos = "discoveryos.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["discoveryos*"]
