name: DiscoveryOS Evidence Benchmark v1

on:
  push:
    branches: ["benchmark/discoveryos-v1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic benchmark
        run: python benchmarks/discoveryos/v1/run_benchmark.py
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: discoveryos-v1-results
          path: benchmarks/discoveryos/v1/results.json
          retention-days: 30
