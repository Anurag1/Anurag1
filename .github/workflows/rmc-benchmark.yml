name: RMC tests and full-cost benchmark

on:
  push:
    paths:
      - "research/regenerative-memoryless-computing/**"
      - ".github/workflows/rmc-benchmark.yml"
  pull_request:
    paths:
      - "research/regenerative-memoryless-computing/**"
      - ".github/workflows/rmc-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        working-directory: research/regenerative-memoryless-computing
        run: python -m unittest discover -s tests -v
      - name: Run full-cost benchmark
        working-directory: research/regenerative-memoryless-computing
        run: |
          mkdir -p artifacts
          python rmc_benchmark.py --size-mib 1 --repeat 3 --output artifacts/results.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: rmc-benchmark-python-${{ matrix.python-version }}
          path: research/regenerative-memoryless-computing/artifacts/results.json
          if-no-files-found: error
