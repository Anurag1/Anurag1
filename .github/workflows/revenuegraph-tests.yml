name: RevenueGraph AI tests

on:
  push:
    paths:
      - "revenuegraph-ai/**"
  pull_request:
    paths:
      - "revenuegraph-ai/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revenuegraph-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
